[www]
; Số tiến trình PHP chạy song song.
;
; Trước đây để 20 với memory_limit 512M — tức là lúc cao điểm có thể ngốn tới
; 10GB, trong khi máy ảo WSL chỉ được cấp 4GB. Hết RAM là hệ điều hành phải
; đẩy sang ổ cứng, chậm hơn nhiều lần so với việc xếp hàng chờ.
;
; 10 tiến trình đủ cho một trang quản trị vài người dùng cùng lúc và một
; website đang chạy. Máy chủ mạnh hơn thì nâng lại.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Tái sinh tiến trình sau 500 lượt phục vụ — tránh rò rỉ bộ nhớ tích tụ
pm.max_requests = 500
