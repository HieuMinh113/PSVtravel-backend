upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120
expose_php = Off

; OPcache — nhớ bytecode đã biên dịch, khỏi biên dịch lại mỗi request
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Cứ mỗi 2 giây OPcache lại đi kiểm tra xem file nguồn có đổi không.
; Mỗi lần kiểm là một lượt đọc đĩa, mà Laravel + Filament chạm tới hàng nghìn
; file — trên Docker Windows mỗi lượt đọc phải đi qua cầu nối giữa hai hệ
; thống tệp nên rất tốn. Nâng lên 60 giây giảm số lượt kiểm 30 lần, đổi lại
; sửa mã xong phải chờ tối đa 1 phút mới thấy (hoặc chạy optimize:clear).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; JIT — biên dịch xuống mã máy, nhanh thêm nữa (PHP 8.4)
opcache.jit = 1255
opcache.jit_buffer_size = 64M