server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    client_max_body_size 20M;

    # Ảnh và tệp do admin tải lên.
    #
    # Laravel mặc định phục vụ qua liên kết tượng trưng public/storage tạo bằng
    # `artisan storage:link`. Trên Docker Desktop chạy Windows, liên kết đó
    # thường hỏng: lệnh báo thành công nhưng nginx không lần được qua nó, trả
    # về 403 dù tệp vẫn nằm nguyên trên đĩa.
    #
    # Trỏ thẳng vào thư mục thật là hết phụ thuộc liên kết tượng trưng, chạy
    # đúng trên mọi hệ điều hành.
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;

        # Ảnh tour hầu như không đổi — cho trình duyệt giữ lại một tháng,
        # đỡ tải lại mỗi lần khách mở trang
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        # Chỉ phục vụ tệp tĩnh, không bao giờ thực thi mã trong thư mục upload
        location ~ \.(php|phtml|phar|sh|py)$ {
            deny all;
        }

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Hỏi DNS của Docker địa chỉ container "app" theo từng lượt (nhớ 10 giây).
        #
        # Ghi thẳng "fastcgi_pass app:9000" thì nginx chỉ tra địa chỉ MỘT LẦN lúc
        # khởi động. Mỗi lần `docker compose build app && docker compose up -d`,
        # container app được tạo lại với IP mới mà nginx vẫn gửi vào IP cũ →
        # 502 Bad Gateway cho tới khi restart nginx. Đặt qua biến thì nginx tự
        # tra lại, app vừa lên là trang chạy tiếp.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}