services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: psvtravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - psvtravel
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: psvtravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - psvtravel
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: psvtravel_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=psvtravel
      - POSTGRES_USER=psvtravel
      - POSTGRES_PASSWORD=secret
    ports:
      - "5434:5432"
    volumes:
      - psvtravel_pgdata:/var/lib/postgresql/data
    networks:
      - psvtravel

  redis:
    image: redis:7-alpine
    container_name: psvtravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - psvtravel

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: psvtravel_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ./:/var/www
    networks:
      - psvtravel
    depends_on:
      - postgres
      - redis

networks:
  psvtravel:
    driver: bridge

volumes:
  psvtravel_pgdata:
    driver: local